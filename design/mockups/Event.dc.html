<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0B0D; color: #F2F4F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 8px 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="Review.dc.html" aria-label="Back to Review" style="height: 44px; display: flex; align-items: center; gap: 2px; color: {{accent}}; font-size: 17px; padding-right: 8px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      <span>Review</span>
    </a>
    <button aria-label="Share clip" style="width: 44px; height: 44px; border: none; background: transparent; color: {{accent}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"></path></svg>
    </button>
  </div>

  <div style="position: relative; width: 390px; height: 219px; background: #1A1E24">
    <svg width="390" height="219" viewBox="0 0 390 219" aria-hidden="true">
      <rect width="390" height="219" fill="#1A1E24"></rect>
      <path d="M0 140 L390 124 L390 219 L0 219 Z" fill="#20252D"></path>
      <path d="M40 140 V70 L110 30 L180 70 V136" fill="none" stroke="#2C333D" stroke-width="3"></path>
      <rect x="92" y="88" width="36" height="50" fill="none" stroke="#2C333D" stroke-width="3"></rect>
      <circle cx="160" cy="100" r="11" fill="#39414D"></circle>
      <path d="M144 162 Q146 118 160 114 Q174 118 176 162 Z" fill="#39414D"></path>
      <path d="M300 160 C 260 156, 210 150, 162 150" fill="none" stroke="#FF9F43" stroke-width="2" stroke-dasharray="4 4"></path>
    </svg>
    <button aria-label="Play" style="position: absolute; left: 167px; top: 82px; width: 56px; height: 56px; border-radius: 28px; border: none; background: rgba(0,0,0,0.6); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>
    </button>
  </div>

  <div style="padding: 10px 16px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="position: relative; height: 28px; display: flex; align-items: center">
      <div style="position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: #2A2E35"></div>
      <div style="position: absolute; left: 0; width: 38%; height: 4px; border-radius: 2px; background: {{accent}}"></div>
      <div style="position: absolute; left: 24%; width: 46%; height: 14px; border-radius: 3px; background: rgba(255,159,67,0.28)"></div>
      <div style="position: absolute; left: calc(38% - 8px); width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9AA3AF">
      <span>0:16</span>
      <span>1x · 2x · 4x</span>
      <span>0:42</span>
    </div>
  </div>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 6px">
      <span style="padding: 3px 8px; border-radius: 6px; background: #FF9F43; color: #1A1206; font-size: 12px; font-weight: 700">person</span>
      <span style="padding: 3px 8px; border-radius: 6px; background: #1A1D22; border: 1px solid #2A2E35; font-size: 12px; font-weight: 600; color: #C9CFD6">Alert</span>
    </div>
    <h1 style="margin: 0; font-size: 24px; font-weight: 700">Front door</h1>
    <span style="font-size: 14px; color: #9AA3AF">Today, 14:31:12 to 14:31:54</span>
  </div>

  <div style="margin: 16px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="padding: 10px 12px; border-radius: 12px; background: #15171B; border: 1px solid #23272E; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 11px; color: #9AA3AF; font-weight: 600">SCORE</span>
      <span style="font-size: 17px; font-weight: 700">87%</span>
    </div>
    <div style="padding: 10px 12px; border-radius: 12px; background: #15171B; border: 1px solid #23272E; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 11px; color: #9AA3AF; font-weight: 600">ZONES</span>
      <span style="font-size: 17px; font-weight: 700">porch</span>
    </div>
    <div style="padding: 10px 12px; border-radius: 12px; background: #15171B; border: 1px solid #23272E; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 11px; color: #9AA3AF; font-weight: 600">FACE</span>
      <span style="font-size: 17px; font-weight: 700">Unknown</span>
    </div>
  </div>

  <div style="margin: 16px 16px 0; display: flex; flex-direction: column; gap: 0; border-radius: 14px; background: #15171B; border: 1px solid #23272E; overflow: hidden">
    <span style="font-size: 12px; font-weight: 600; color: #9AA3AF; letter-spacing: 0.4px; padding: 12px 14px 6px">OBJECT LIFECYCLE</span>
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 44px; border-top: 1px solid #23272E">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{s.dot}}"></span>
        <span style="flex: 1; font-size: 14px">{{s.text}}</span>
        <span style="font-size: 13px; color: #9AA3AF">{{s.time}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 0 16px 34px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button style="height: 50px; border-radius: 12px; border: none; background: {{accent}}; color: #0A0B0D; font: 600 15px Inter, sans-serif">Reviewed</button>
    <button style="height: 50px; border-radius: 12px; border: 1px solid #2A2E35; background: #15171B; color: #F2F4F7; font: 600 15px Inter, sans-serif">Download</button>
    <button style="height: 50px; border-radius: 12px; border: 1px solid #2A2E35; background: #15171B; color: #FF6B60; font: 600 15px Inter, sans-serif">Delete</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B9BFF","options":["#5B9BFF","#3DD6B5","#FFB547"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#5B9BFF',
      steps: [
        { text: 'Person detected', time: '14:31:12', dot: '#FF9F43' },
        { text: 'Entered zone porch', time: '14:31:19', dot: '#5B9BFF' },
        { text: 'Left the frame', time: '14:31:54', dot: '#8E8E93' }
      ]
    };
  }
}
</script>
</body>
</html>
