<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frigate Live</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0B0D; color: #F2F4F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="padding: 60px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Servers.dc.html" aria-label="Switch server" style="height: 36px; padding: 0 12px 0 6px; border-radius: 18px; background: #15171B; border: 1px solid #2A2E35; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">
        <span style="width: 24px; height: 24px; border-radius: 7px; background: #5B9BFF; color: #0A0B0D; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">H</span>
        <span>Home NVR</span>
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #34C759"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA3AF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </a>
      <button aria-label="Notifications" style="width: 44px; height: 44px; border: none; background: transparent; color: #F2F4F7; display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 4px; background: #FF9F43"></span>
      </button>
    </div>
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px">Live</h1>
    <div style="display: flex; gap: 8px">
      <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: none; background: {{accent}}; color: #0A0B0D; font: 600 14px Inter, sans-serif">All</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #2A2E35; background: #15171B; color: #F2F4F7; font: 500 14px Inter, sans-serif">Outdoor</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #2A2E35; background: #15171B; color: #F2F4F7; font: 500 14px Inter, sans-serif">Indoor</button>
      <button aria-label="Edit groups" style="height: 34px; width: 34px; border-radius: 17px; border: 1px solid #2A2E35; background: #15171B; color: #9AA3AF; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
  </div>

  <div style="flex: 1; padding: 6px 16px 100px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-content: start">
    <sc-for list="{{cams}}" as="cam" hint-placeholder-count="6">
      <a href="Camera.dc.html" style="display: flex; flex-direction: column; gap: 6px">
        <div style="position: relative; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; background: #1A1E24; border: 1px solid #23272E">
          <svg width="100%" height="100%" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <rect width="160" height="100" fill="#1A1E24"></rect>
            <path d="M0 62 L160 54 L160 100 L0 100 Z" fill="#20252D"></path>
            <path d="M18 62 V34 L44 18 L70 34 V60" fill="none" stroke="#2C333D" stroke-width="2"></path>
            <path d="M96 100 L118 56 L132 56 L150 100" fill="#242A33"></path>
          </svg>
          <div style="position: absolute; top: 8px; left: 8px; display: flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,0.55); font-size: 11px; font-weight: 600">
            <span style="width: 6px; height: 6px; border-radius: 3px; background: {{cam.dot}}"></span>
            <span>{{cam.state}}</span>
          </div>
          <sc-if value="{{cam.hasObj}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; bottom: 8px; left: 8px; padding: 3px 7px; border-radius: 6px; background: #FF9F43; color: #1A1206; font-size: 11px; font-weight: 700">{{cam.obj}}</div>
          </sc-if>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px">
          <span style="font-size: 14px; font-weight: 600">{{cam.name}}</span>
          <span style="font-size: 12px; color: #9AA3AF">{{cam.meta}}</span>
        </div>
      </a>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(16,18,21,0.96); border-top: 1px solid #23272E; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-top: 6px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}}; font-size: 11px; font-weight: 600; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg>
      <span>Live</span>
    </a>
    <a href="Review.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9AA3AF; font-size: 11px; font-weight: 500; min-height: 44px; position: relative">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <span>Review</span>
      <span style="position: absolute; top: -2px; left: 54%; min-width: 18px; height: 18px; border-radius: 9px; background: #FF9F43; color: #1A1206; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box">12</span>
    </a>
    <a href="HistoryOverview.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9AA3AF; font-size: 11px; font-weight: 500; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span>History</span>
    </a>
    <a href="Servers.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9AA3AF; font-size: 11px; font-weight: 500; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
      <span>Settings</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B9BFF","options":["#5B9BFF","#3DD6B5","#FFB547"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var cams = [
      { name: 'Front door', meta: '1 min ago', state: 'LIVE', dot: '#34C759', hasObj: true, obj: 'person' },
      { name: 'Driveway', meta: '4 min ago', state: 'LIVE', dot: '#34C759', hasObj: true, obj: 'car' },
      { name: 'Backyard', meta: '22 min ago', state: 'LIVE', dot: '#34C759', hasObj: false, obj: '' },
      { name: 'Garage', meta: '1 h ago', state: 'LIVE', dot: '#34C759', hasObj: false, obj: '' },
      { name: 'Living room', meta: 'Detect off', state: 'LIVE', dot: '#34C759', hasObj: false, obj: '' },
      { name: 'Shed', meta: 'Offline', state: 'OFFLINE', dot: '#8E8E93', hasObj: false, obj: '' }
    ];
    return { accent: this.props.accent ?? '#5B9BFF', cams: cams };
  }
}
</script>
</body>
</html>
