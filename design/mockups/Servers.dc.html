<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Servers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0B0D; color: #F2F4F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="padding: 60px 20px 12px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px">Servers</h1>
    <a href="Connect.dc.html" aria-label="Add server" style="width: 44px; height: 44px; border-radius: 22px; background: #15171B; border: 1px solid #2A2E35; display: flex; align-items: center; justify-content: center; color: {{accent}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </div>

  <div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; color: #9AA3AF; letter-spacing: 0.4px; padding: 0 4px">SHOW</span>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #15171B; border: 1px solid #23272E">
      <span style="width: 40px; height: 40px; border-radius: 10px; background: #1F2329; display: flex; align-items: center; justify-content: center; color: #C9CFD6">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="7" rx="2"></rect><rect x="2" y="14" width="20" height="7" rx="2"></rect><path d="M6 6.5h.01M6 17.5h.01"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">All servers</span>
        <span style="font-size: 13px; color: #9AA3AF">10 cameras from 2 online servers</span>
      </span>
    </a>
  </div>

  <div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; color: #9AA3AF; letter-spacing: 0.4px; padding: 0 4px">YOUR SERVERS</span>
    <sc-for list="{{servers}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #15171B; border: 1px solid {{s.border}}">
        <a href="Main.dc.html" style="flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0">
          <span style="width: 40px; height: 40px; border-radius: 10px; background: {{s.tint}}; color: #0A0B0D; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">{{s.initial}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="display: flex; align-items: center; gap: 6px">
              <span style="font-size: 16px; font-weight: 600">{{s.name}}</span>
              <span style="width: 7px; height: 7px; border-radius: 4px; background: {{s.dot}}"></span>
            </span>
            <span style="font-size: 13px; color: #9AA3AF">{{s.meta}}</span>
            <span style="font-size: 12px; color: #9AA3AF">{{s.addr}}</span>
          </span>
          <sc-if value="{{s.active}}" hint-placeholder-val="{{ false }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Active server" role="img"><path d="M20 6L9 17l-5-5"></path></svg>
          </sc-if>
        </a>
        <a href="Connect.dc.html" aria-label="Edit {{s.name}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #9AA3AF">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-5M12 8h.01"></path></svg>
        </a>
      </div>
    </sc-for>
  </div>

  <div style="margin: 18px 16px 0; border-radius: 14px; background: #15171B; border: 1px solid #23272E; overflow: hidden">
    <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; min-height: 52px; box-sizing: border-box; border-bottom: 1px solid #23272E">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px">{{t.label}}</span>
          <span style="font-size: 12px; color: #9AA3AF">{{t.sub}}</span>
        </span>
        <span style="width: 51px; height: 31px; border-radius: 16px; background: #34C759; position: relative; flex-shrink: 0">
          <span style="position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF"></span>
        </span>
      </label>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(16,18,21,0.96); border-top: 1px solid #23272E; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-top: 6px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9AA3AF; font-size: 11px; font-weight: 500; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg>
      <span>Live</span>
    </a>
    <a href="Review.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9AA3AF; font-size: 11px; font-weight: 500; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <span>Review</span>
    </a>
    <a href="HistoryOverview.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9AA3AF; font-size: 11px; font-weight: 500; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span>History</span>
    </a>
    <a href="Servers.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}}; font-size: 11px; font-weight: 600; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
      <span>Settings</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B9BFF","options":["#5B9BFF","#3DD6B5","#FFB547"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#5B9BFF';
    return {
      accent: accent,
      servers: [
        { name: 'Home NVR', initial: 'H', tint: '#5B9BFF', dot: '#34C759', meta: '6 cameras · v0.16 · Local', addr: 'frigate.local:8971', active: true, border: accent },
        { name: 'Office', initial: 'O', tint: '#3DD6B5', dot: '#34C759', meta: '4 cameras · v0.16 · Remote', addr: 'nvr.office.example:8971', active: false, border: '#23272E' },
        { name: 'Cabin', initial: 'C', tint: '#FFB547', dot: '#8E8E93', meta: 'Offline · last seen 2 days ago', addr: '10.8.0.12:8971', active: false, border: '#23272E' }
      ],
      toggles: [
        { label: 'Combined review', sub: 'Show alerts from all servers in Review' },
        { label: 'Notifications per server', sub: 'Choose cameras and labels per server' }
      ]
    };
  }
}
</script>
</body>
</html>
